name: Publish blog and refresh live data

# Runs daily at 09:00 IST (03:30 UTC).
#
# Daily rather than weekly on purpose: articles are gated on their own date and
# every one is dated a Monday, so a post still appears exactly once a week. The
# daily run is for the two pages that go stale, chess news and world rankings.
#
# GitHub may start scheduled runs late. That is harmless here: the build is
# driven by dates rather than by a queue it consumes, so a late, repeated or
# manually triggered run all produce the same result.
on:
  schedule:
    # 20:30 UTC is 02:00 IST the next day. GitHub's shared schedulers have
    # been running this job roughly five hours late, so aiming at 02:00 IST
    # lands the post in the early morning here rather than mid-afternoon.
    # Safe because the build gates on the IST date, which has already rolled over.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build articles
        run: python3 blog/build.py

      - name: Refresh rankings and news
        run: python3 blog/live.py

      - name: Commit anything that changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed today."
            exit 0
          fi
          git config user.name  "E4CA blog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          git commit -m "Publish due posts and refresh live data"
          git push
