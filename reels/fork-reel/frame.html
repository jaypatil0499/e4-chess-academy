  display:flex;align-items:center;justify-content:center;gap:16px;
}
.brand i{width:34px;height:61px;background:var(--logo) center/contain no-repeat;display:block;}
.brand span{font-size:24px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,243,234,.72);}

/* ── caption block above the board ─────────────────────── */
.top{position:absolute;top:190px;left:70px;right:70px;text-align:center;}
.eyebrow{
  display:inline-block;font-size:22px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--navy);background:var(--gold);padding:9px 22px;border-radius:100px;margin-bottom:26px;
}
.head{font-family:var(--f-display);font-size:94px;font-weight:900;line-height:1.02;letter-spacing:-.02em;}
.head em{font-style:italic;font-weight:400;color:var(--gold);}
.head.sm{font-size:74px;}

/* ── board ─────────────────────────────────────────────── */
#board{position:absolute;left:80px;top:560px;width:920px;height:920px;
  border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.sq{position:absolute;width:115px;height:115px;}
.piece{
  position:absolute;width:115px;height:115px;
  display:grid;place-items:center;font-size:104px;line-height:1;
  transition:none;
}
.piece.w{color:#FFFDF7;-webkit-text-stroke:3px #223040;}
.piece.b{color:#14202B;-webkit-text-stroke:3px rgba(255,255,255,.18);}
#fx{position:absolute;left:0;top:0;width:920px;height:920px;pointer-events:none;}
#dim{position:absolute;inset:0;background:rgba(13,31,45,.78);opacity:0;}

/* ── caption below the board ───────────────────────────── */
.bot{position:absolute;top:1548px;left:70px;right:70px;text-align:center;}
.sub{font-size:44px;font-weight:500;line-height:1.32;color:rgba(247,243,234,.9);}
.sub b{color:var(--gold);font-weight:700;}
.move-chip{
  display:inline-block;font-family:var(--f-body);font-size:50px;font-weight:700;
  letter-spacing:.02em;color:var(--navy);background:var(--gold);
  padding:12px 34px;border-radius:14px;margin-bottom:20px;
}

/* ── full-screen statement cards ───────────────────────── */
.card{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:0 92px;text-align:center;gap:34px;}
.card .big{font-family:var(--f-display);font-size:150px;font-weight:900;line-height:.98;letter-spacing:-.03em;color:var(--gold);}
.card .defn{font-size:52px;line-height:1.4;color:var(--cream);}
.card .defn b{color:var(--gold);}

/* ── footer handle ─────────────────────────────────────── */
.foot{position:absolute;bottom:74px;left:0;right:0;text-align:center;
  font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(247,243,234,.42);}

/* ── closing CTA ───────────────────────────────────────── */
.cta{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.cta .lg{width:210px;height:379px;background:var(--logo) center/contain no-repeat;
  filter:drop-shadow(0 20px 50px rgba(0,180,216,.3));margin-bottom:44px;}
.cta .nm{font-family:var(--f-display);font-size:82px;font-weight:900;letter-spacing:-.01em;}
.cta .tl{font-size:30px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:14px;}
.cta .ln{width:90px;height:3px;background:var(--gold);margin:46px 0;}
.cta .of{font-size:52px;font-weight:700;color:var(--cream);}
.cta .ur{font-size:40px;font-weight:500;color:var(--cyan2);margin-top:22px;}
.cta .wa{font-size:32px;font-weight:500;color:rgba(247,243,234,.6);margin-top:16px;}
</style>

<div class="brand" id="brandbar"><i></i><span>E4 Chess Academy</span></div>

  <div id="squares"></div>
  <div id="pieces"></div>
  <svg id="fx" viewBox="0 0 920 920"></svg>
  <div id="dim"></div>
</div>

  <div class="big" id="cardBig"></div>

</div>

  <div class="ur">e4chessacademy.com</div>

</div>

<div class="foot" id="foot">@e4.chess_academy</div>

<script>
var S = 115, GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };

// Position after 1...Ra8 — White to play and win material.
// FEN: r3k3/5ppp/8/1N6/8/8/5PPP/4K3 w
var BASE = [
  {id:'br', c:'b', t:'r', f:0, r:0},   // a8 rook
  {id:'bk', c:'b', t:'k', f:4, r:0},   // e8 king
  {id:'bp1',c:'b', t:'p', f:5, r:1}, {id:'bp2',c:'b',t:'p',f:6,r:1}, {id:'bp3',c:'b',t:'p',f:7,r:1},
  {id:'wn', c:'w', t:'n', f:1, r:3},   // b5 knight
  {id:'wk', c:'w', t:'k', f:4, r:7},   // e1 king
  {id:'wp1',c:'w', t:'p', f:5, r:6}, {id:'wp2',c:'w',t:'p',f:6,r:6}, {id:'wp3',c:'w',t:'p',f:7,r:6}
];

function cx(f){ return f * S + S / 2; }
function cy(r){ return r * S + S / 2; }

function drawSquares(){
  var h = '';
  for (var r = 0; r < 8; r++) {
    for (var f = 0; f < 8; f++) {
      var dark = (r + f) % 2 === 1;
      h += '<div class="sq" style="left:' + (f*S) + 'px;top:' + (r*S) + 'px;background:'
         + (dark ? 'var(--sq-dark)' : 'var(--sq-light)') + '"></div>';
    }
  }
  document.getElementById('squares').innerHTML = h;
}

function drawPieces(list){
  var h = '';
  list.forEach(function(p){
    h += '<div class="piece ' + p.c + '" style="left:' + (p.f*S) + 'px;top:' + (p.r*S) + 'px">'
       + GLYPH[p.t] + '</div>';
  });
  document.getElementById('pieces').innerHTML = h;
}

function ring(f, r, color){
  return '<circle cx="' + cx(f) + '" cy="' + cy(r) + '" r="52" fill="none" stroke="' + color
       + '" stroke-width="7" opacity=".95"/>';
}
function dot(f, r, color){
  return '<circle cx="' + cx(f) + '" cy="' + cy(r) + '" r="15" fill="' + color + '" opacity=".85"/>';
}
function arrow(f1, r1, f2, r2, color){
  var x1 = cx(f1), y1 = cy(r1), x2 = cx(f2), y2 = cy(r2);
  var dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  // stop short of the target so the arrowhead sits beside the piece, not on it
  var ux = dx / len, uy = dy / len, back = 56;
  x2 -= ux * back; y2 -= uy * back;
  var ang = Math.atan2(uy, ux), head = 34, spread = 0.44;
  var p1x = x2 - head * Math.cos(ang - spread), p1y = y2 - head * Math.sin(ang - spread);
  var p2x = x2 - head * Math.cos(ang + spread), p2y = y2 - head * Math.sin(ang + spread);
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color
       + '" stroke-width="13" stroke-linecap="round" opacity=".95"/>'
       + '<polygon points="' + x2 + ',' + y2 + ' ' + p1x + ',' + p1y + ' ' + p2x + ',' + p2y
       + '" fill="' + color + '" opacity=".95"/>';
}

function set(id, html){ document.getElementById(id).innerHTML = html; }
function show(id, on){ document.getElementById(id).style.display = on ? 'flex' : 'none'; }

function render(n){
  drawSquares();
  var pieces = BASE.map(function(p){ return Object.assign({}, p); });
  var fx = '', dim = 0;
  var eyebrow = 'Chess Tactics', head = '', sub = '';
  var showBoardUI = true, cardOn = false, ctaOn = false;

  function P(id){ return pieces.filter(function(p){ return p.id === id; })[0]; }
  function kill(id){ pieces = pieces.filter(function(p){ return p.id !== id; }); }

  // knight glide path b5 -> c7, as an L: up two, across one
  var glide = [ [1,3], [1,2], [1,1], [2,1] ];

  if (n === 0) {
    head = 'White to <em>play.</em>';
    sub = 'Can you find the winning move?';
  } else if (n === 1) {
    head = 'White to <em>play.</em>';
    sub = 'Start with the <b>knight</b>.';
    fx = ring(1, 3, '#C9A84C');
  } else if (n >= 2 && n <= 4) {
    // frames 2,3,4 walk the knight along the L
    var step = glide[n - 1];
    P('wn').f = step[0]; P('wn').r = step[1];
    head = 'White to <em>play.</em>';
    sub = 'Start with the <b>knight</b>.';
    fx = dot(1, 3, 'rgba(201,168,76,.45)');
  } else if (n === 5) {
    P('wn').f = 2; P('wn').r = 1;              // c7
    eyebrow = 'The move';
    head = 'Knight to <em>c7.</em>';
    sub = '<span class="move-chip">Nc7+</span>';
    fx = dot(1, 3, 'rgba(201,168,76,.35)') + ring(2, 1, '#C9A84C');
  } else if (n === 6) {
    P('wn').f = 2; P('wn').r = 1;
    eyebrow = 'Look again';
    head = 'It attacks <em>two</em> pieces.';
    sub = 'The <b>king</b> and the <b>rook</b> &mdash; at the same time.';
    fx = ring(2, 1, '#C9A84C')
       + arrow(2, 1, 4, 0, '#00B4D8')          // c7 -> e8 king
       + arrow(2, 1, 0, 0, '#00B4D8')          // c7 -> a8 rook
       + ring(4, 0, '#00B4D8') + ring(0, 0, '#00B4D8');
  } else if (n === 7) {
    P('wn').f = 2; P('wn').r = 1;
    fx = ring(2, 1, '#C9A84C')
       + arrow(2, 1, 4, 0, '#00B4D8') + arrow(2, 1, 0, 0, '#00B4D8');
    dim = 1; cardOn = true; showBoardUI = false;
    set('cardBig', 'THAT&rsquo;S<br>A FORK');
    set('cardDefn', '');
  } else if (n === 8) {
    P('wn').f = 2; P('wn').r = 1;
    dim = 1; cardOn = true; showBoardUI = false;
    set('cardBig', 'FORK');
    set('cardDefn', 'One piece attacking <b>two or more</b> enemy pieces at the same time.');
  } else if (n === 9) {
    P('wn').f = 2; P('wn').r = 1;
    P('bk').f = 5; P('bk').r = 0;               // king runs to f8
    eyebrow = 'Why it wins';
    head = 'The king <em>must</em> move.';
    sub = 'A check cannot be ignored.';
    fx = ring(5, 0, '#00B4D8') + dot(4, 0, 'rgba(0,180,216,.35)');
  } else if (n === 10) {
    kill('br');
    P('wn').f = 0; P('wn').r = 0;               // Nxa8
    P('bk').f = 5; P('bk').r = 0;
    eyebrow = 'The point';
    head = 'So the rook <em>falls.</em>';
    sub = '<span class="move-chip">Nxa8</span>';
    fx = ring(0, 0, '#C9A84C');
  } else if (n === 11) {
    kill('br');
    P('wn').f = 0; P('wn').r = 0;
    P('bk').f = 5; P('bk').r = 0;
    eyebrow = 'Remember';
    head = 'One move. <em>Two targets.</em>';
    sub = 'That is why the knight is the trickiest piece on the board.';
  } else if (n === 12) {
    showBoardUI = false; ctaOn = true;
  }

  drawPieces(pieces);
  document.getElementById('fx').innerHTML = fx;
  document.getElementById('dim').style.opacity = dim;

  document.getElementById('eyebrow').innerHTML = eyebrow;
  set('head', head);
  set('sub', sub);
  document.getElementById('top').style.display = showBoardUI ? 'block' : 'none';
  document.getElementById('bot').style.display = showBoardUI ? 'block' : 'none';
  document.getElementById('board').style.display = ctaOn ? 'none' : 'block';
  document.getElementById('brandbar').style.display = ctaOn ? 'none' : 'flex';
  document.getElementById('foot').style.display = ctaOn ? 'none' : 'block';
  show('card', cardOn);
  show('cta', ctaOn);
}

var f = parseInt((location.search.match(/f=(\d+)/) || [])[1] || '0', 10);
render(f);
document.title = 'frame ' + f;
</script>
